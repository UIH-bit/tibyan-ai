<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibyan AI</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #222222;
            --secondary-text: #666666;
            --accent-color: #0b5ed7; /* Clean professional blue/green as preferred */
            --border-color: #e0e0e0;
            --card-bg: #f8f9fa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100%;
            left: -260px;
            transition: 0.3s ease;
            z-index: 1000;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu li a {
            display: block;
            padding: 15px 20px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 1rem;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .sidebar-menu li a:hover {
            background-color: #e9ecef;
        }

        /* Main Container */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            margin-left: 0;
            transition: 0.3s ease;
        }

        /* Header bar */
        header {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            margin-right: 15px;
            color: var(--text-color);
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Chat / Welcome Area */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }

        .welcome-arabic {
            font-size: 2.5rem;
            font-weight: bold;
            color: #111;
            margin-bottom: 10px;
        }

        .welcome-subtitle {
            font-size: 1.1rem;
            color: var(--secondary-text);
            margin-bottom: 30px;
        }

        /* Suggestion Chips */
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .chip {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            cursor: pointer;
            color: var(--text-color);
            transition: all 0.2s;
        }

        .chip:hover {
            background-color: #e2e6ea;
            border-color: #adb5bd;
        }

        /* Input Box Area */
        .input-container {
            padding: 20px;
            display: flex;
            justify-content: center;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
        }

        .input-box-wrapper {
            display: flex;
            width: 100%;
            max-width: 700px;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 15px;
            background-color: var(--card-bg);
            align-items: center;
        }

        .input-box-wrapper input {
            flex: 1;
            border: none;
            background: none;
            outline: none;
            font-size: 1rem;
            padding: 8px;
            color: var(--text-color);
        }

        .send-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--accent-color);
            padding: 5px 10px;
        }
    </style>
</head>
<body>

    <!-- Sidebar Menu -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>Tibyan AI</span>
            <button class="menu-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#">🏠 Home</a></li>
            <li><a href="#">📚 Library</a></li>
            <li><a href="#">💾 Saved</a></li>
            <li><a href="#">⚙️ Setting</a></li>
            <li><a href="#">ℹ️ About</a></li>
        </ul>
    </div>

    <!-- Main App Interface -->
    <div class="main-container">
        <header>
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <div class="app-title">Tibyan AI</div>
        </header>

        <div class="content-area">
            <div class="welcome-arabic">السلام عليكم</div>
            <div class="welcome-subtitle">Ask anything about Islam from authentic sources</div>

            <div class="suggestions">
                <div class="chip" onclick="selectPrompt('What breaks the fast?')">What breaks the fast?</div>
                <div class="chip" onclick="selectPrompt('Virtues of Ayat al-Kursi')">Virtues of Ayat al-Kursi</div>
                <div class="chip" onclick="selectPrompt('How to perform Tahajjud?')">How to perform Tahajjud?</div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box-wrapper">
                <input type="text" id="userInput" placeholder="Type your question...">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function selectPrompt(text) {
            document.getElementById('userInput').value = text;
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            if(input.value.trim() !== "") {
                // Yahan aap apna chat submission logic add kar sakte hain
                alert("Sending: " + input.value);
                input.value = "";
            }
        }
    </script>
</body>
</html>
