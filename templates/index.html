<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibyan AI</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #202124;
            --sidebar-bg: #f8f9fa;
            --border-color: #e0e0e0;
            --primary-color: #1a73e8;
            --bot-bubble: #f1f3f4;
            --user-bubble: #1a73e8;
            --user-text: #ffffff;
            --bot-text: #202124;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }
        .sidebar-header {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
        }
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }
        .sidebar-menu li {
            padding: 15px 20px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
        }
        .sidebar-menu li:hover {
            background-color: #e8eaed;
        }
        .main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .menu-toggle {
            cursor: pointer;
            font-size: 20px;
            display: none;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.bot {
            background-color: var(--bot-bubble);
            color: var(--bot-text);
            align-self: flex-start;
        }
        .message.user {
            background-color: var(--user-bubble);
            color: var(--user-text);
            align-self: flex-end;
        }
        .suggestions {
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }
        .chip {
            background-color: #f1f3f4;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        .chip:hover {
            background-color: #e8eaed;
        }
        .chat-input-area {
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex-grow: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            outline: none;
            font-size: 15px;
        }
        .chat-input-area button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
        }
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                height: 100%;
                transform: translateX(-100%);
            }
            .sidebar.active {
                transform: translateX(0);
            }
            .menu-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">✨ Tibyan AI</div>
        <ul class="sidebar-menu">
            <li onclick="alert('Home')">🏠 Home</li>
            <li onclick="alert('Library')">📚 Library</li>
            <li onclick="alert('Saved')">⭐ Saved</li>
            <li onclick="alert('Setting')">⚙️ Setting</li>
            <li onclick="alert('About')">ℹ️ About</li>
        </ul>
    </div>
    <div class="main-container">
        <div class="chat-header">
            <span class="menu-toggle" onclick="toggleSidebar()">☰</span>
            <span>Tibyan AI Collaborator</span>
            <span></span>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">Hello! I am ready. How can I help you today? (بسلامت، فرمiye kya madad chahiye?)</div>
        </div>
        <div class="suggestions">
            <div class="chip" onclick="sendSuggestion('What breaks fast')">What breaks fast</div>
            <div class="chip" onclick="sendSuggestion('Zakat calculation rules')">Zakat rules</div>
            <div class="chip" onclick="sendSuggestion('Authentic Hadith sources')">Hadith sources</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask anything..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function sendSuggestion(text) { document.getElementById('userInput').value = text; sendMessage(); }
        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            const chat = document.getElementById('chatMessages');
            
            const uDiv = document.createElement('div');
            uDiv.className = 'message user';
            uDiv.innerText = text;
            chat.appendChild(uDiv);
            input.value = '';
            
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                const data = await res.json();
                const bDiv = document.createElement('div');
                bDiv.className = 'message bot';
                bDiv.innerText = data.response;
                chat.appendChild(bDiv);
            } catch (e) {
                const bDiv = document.createElement('div');
                bDiv.className = 'message bot';
                bDiv.innerText = "Error connecting server.";
                chat.appendChild(bDiv);
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
