<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibyan AI</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --sidebar-bg: #f8f9fa;
            --text-color: #212529;
            --accent-color: #1b4332;
            --border-color: #e9ecef;
            --input-bg: #f1f3f5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar Styling */
        #sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100%;
            left: -260px;
            transition: left 0.3s ease;
            z-index: 1000;
        }
        #sidebar.open {
            left: 0;
        }
        .sidebar-header {
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
        }
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
        }
        .sidebar-menu li a {
            display: block;
            padding: 15px 20px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 16px;
            transition: background 0.2s;
        }
        .sidebar-menu li a:hover {
            background-color: #e2e6ea;
            color: var(--accent-color);
        }
        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            position: relative;
        }
        header {
            background-color: var(--bg-color);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 20px;
            color: var(--accent-color);
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
        }
        .menu-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 22px;
            cursor: pointer;
        }
        /* Chat & Welcome Container */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 110px;
        }
        /* Welcome Center Screen */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            padding: 20px;
        }
        .arabic-greeting {
            font-size: 42px;
            color: var(--accent-color);
            margin-bottom: 10px;
            font-weight: bold;
        }
        .welcome-sub {
            font-size: 16px;
            color: #6c757d;
            margin-bottom: 25px;
        }
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 600px;
        }
        .suggestion-chip {
            background: #f8f9fa;
            border: 1px solid #ced4da;
            color: var(--text-color);
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .suggestion-chip:hover {
            background-color: #e2e6ea;
            border-color: var(--accent-color);
        }
        /* Chat Messages */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #d8f3dc;
            color: #081c15;
            align-self: flex-end;
            border: 1px solid #b7e4c7;
        }
        .bot-message {
            background-color: #f8f9fa;
            color: var(--text-color);
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }
        /* Auto-Expanding Floating Typing Bar */
        .input-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 700px;
            background: var(--input-bg);
            display: flex;
            align-items: flex-end;
            padding: 10px 15px;
            border-radius: 24px;
            border: 1px solid #ced4da;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            gap: 10px;
        }
        .input-container textarea {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            padding: 8px 0;
            background: transparent;
            color: var(--text-color);
            resize: none;
            max-height: 120px;
            line-height: 1.4;
            font-family: inherit;
        }
        .plus-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 22px;
            color: #495057;
            padding-bottom: 6px;
        }
        .send-btn {
            background-color: #007bff; /* Blue round button */
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            min-width: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 2px;
            box-shadow: 0 2px 5px rgba(0,123,255,0.3);
        }
        #image-preview {
            max-height: 40px;
            border-radius: 4px;
            display: none;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">Tibyan AI</div>
        <ul class="sidebar-menu">
            <li><a href="#" onclick="toggleSidebar()">🏠 Home</a></li>
            <li><a href="#" onclick="toggleSidebar()">📚 Library</a></li>
            <li><a href="#" onclick="toggleSidebar()">💾 Saved</a></li>
            <li><a href="#" onclick="toggleSidebar()">👤 Profile</a></li>
            <li><a href="#" onclick="toggleSidebar()">ℹ️ About</a></li>
        </ul>
    </div>

    <!-- Main Section -->
    <div class="main-content">
        <header>
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <span>Tibyan AI</span>
        </header>

        <div id="chat-container">
            <!-- Welcome screen with Arabic greeting and suggestions -->
            <div id="welcome-screen">
                <div class="arabic-greeting">السلام عليكم</div>
                <div class="welcome-sub">Ask anything about Islam from authentic sources</div>
                <div class="suggestions">
                    <button class="suggestion-chip" onclick="sendSuggestion('What breaks the fast?')">What breaks the fast?</button>
                    <button class="suggestion-chip" onclick="sendSuggestion('Virtues of Ayat al-Kursi')">Virtues of Ayat al-Kursi</button>
                    <button class="suggestion-chip" onclick="sendSuggestion('How to perform Tahajjud?')">How to perform Tahajjud?</button>
                </div>
            </div>
        </div>

        <!-- Floating Input Bar -->
        <div class="input-container">
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewImage(event)">
            <button type="button" class="plus-btn" onclick="document.getElementById('imageInput').click()" title="Attach Image">＋</button>
            
            <img id="image-preview" src="" alt="Preview">
            
            <textarea id="userInput" placeholder="Type your question..." rows="1" oninput="autoExpand(this)" onkeydown="handleKeyDown(event)"></textarea>
            
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        let base64Image = null;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function autoExpand(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Image = e.target.result;
                    const preview = document.getElementById('image-preview');
                    preview.src = base64Image;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        function sendSuggestion(text) {
            document.getElementById('userInput').value = text;
            autoExpand(document.getElementById('userInput'));
            sendMessage();
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            const container = document.getElementById('chat-container');
            const welcomeScreen = document.getElementById('welcome-screen');

            if (!messageText && !base64Image) return;

            if (welcomeScreen) {
                welcomeScreen.remove();
            }

            let userHtml = `<div class="message user-message">`;
            if (base64Image) {
                userHtml += `<img src="${base64Image}" style="max-width:150px; border-radius:6px; display:block; margin-bottom:5px;">`;
            }
            if (messageText) {
                userHtml += `<span>${messageText.replace(/\n/g, '<br>')}</span>`;
            }
            userHtml += `</div>`;
            container.innerHTML += userHtml;

            const payloadMessage = messageText;
            const payloadImage = base64Image;

            inputField.value = '';
            inputField.style.height = 'auto';
            document.getElementById('image-preview').style.display = 'none';
            base64Image = null;
            container.scrollTop = container.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `<div id="${loadingId}" class="message bot-message">Thinking from authentic sources...</div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: payloadMessage, image: payloadImage })
                });
                const data = await response.json();
                
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="message bot-message">${data.response.replace(/\n/g, '<br>')}</div>`;
                container.scrollTop = container.scrollHeight;
            } catch (error) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="message bot-message">Connection error occurred.</div>`;
            }
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
    </script>
</body>
</html>
