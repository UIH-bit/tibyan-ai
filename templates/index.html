<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibyan AI</title>
    <style>
        :root {
            --bg-color: #121212;
            --chat-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --user-bubble: #2b5278;
            --bot-bubble: #252525;
            --input-bg: #2a2a2a;
            --border-color: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: var(--chat-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 100px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }
        .user-message {
            background-color: var(--user-bubble);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            background-color: var(--bot-bubble);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }
        .input-wrapper {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 750px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 8px 14px;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .input-wrapper input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 15px;
            padding: 8px;
        }
        .input-wrapper button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #aaa;
            padding: 6px 10px;
            transition: color 0.2s;
        }
        .input-wrapper button:hover {
            color: #fff;
        }
        .send-btn {
            background-color: #ffffff;
            color: #000000 !important;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        #image-preview {
            max-height: 40px;
            margin-right: 8px;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <span>✨</span> Tibyan AI Collaborator
    </header>

    <div id="chat-container">
        <div class="message bot-message">Hello! I am ready. How can I help you today?</div>
    </div>

    <div class="input-wrapper">
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewImage(event)">
        <button type="button" onclick="document.getElementById('imageInput').click()" title="Attach Image">📎</button>
        
        <img id="image-preview" src="" alt="Preview">
        
        <input type="text" id="userInput" placeholder="Ask anything..." onkeypress="handleKeyPress(event)">
        
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        let base64Image = null;

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Image = e.target.result;
                    const preview = document.getElementById('image-preview');
                    preview.src = base64Image;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            const container = document.getElementById('chat-container');

            if (!messageText && !base64Image) return;

            let userHtml = `<div class="message user-message">`;
            if (base64Image) {
                userHtml += `<img src="${base64Image}" style="max-width:150px; border-radius:6px; display:block; margin-bottom:4px;">`;
            }
            if (messageText) {
                userHtml += `<span>${messageText}</span>`;
            }
            userHtml += `</div>`;
            container.innerHTML += userHtml;

            const payloadMessage = messageText;
            const payloadImage = base64Image;

            inputField.value = '';
            document.getElementById('image-preview').style.display = 'none';
            base64Image = null;
            container.scrollTop = container.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `<div id="${loadingId}" class="message bot-message">Thinking...</div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: payloadMessage, image: payloadImage })
                });
                const data = await response.json();
                
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="message bot-message">${data.response.replace(/\n/g, '<br>')}</div>`;
                container.scrollTop = container.scrollHeight;
            } catch (error) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="message bot-message">Connection error occurred.</div>`;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
