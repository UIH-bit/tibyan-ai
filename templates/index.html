<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibyan AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1b4332;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 90px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #d8f3dc;
            color: #081c15;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .bot-message {
            background-color: #ffffff;
            color: #212529;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        /* Floating Input Bar like the screenshot */
        .input-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 700px;
            background: #ffffff;
            display: flex;
            align-items: center;
            padding: 8px 15px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }
        .input-container input[type="text"] {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            padding: 10px;
            background: transparent;
        }
        .input-container button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: #555;
            padding: 5px 8px;
        }
        .input-container .send-btn {
            background-color: #1b4332;
            color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        #image-preview {
            max-height: 50px;
            margin-right: 10px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <header>Tibyan AI - Authentic Islamic Guidance</header>

    <div id="chat-container">
        <div class="message bot-message">السلام عليكم! Ask anything about Islam from authentic sources (Quran, Sunnah, Deoband Fatwas, Ask Imam).</div>
    </div>

    <div class="input-container">
        <!-- Hidden Image Input -->
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewImage(event)">
        <button type="button" onclick="document.getElementById('imageInput').click()" title="Attach Image">➕</button>
        
        <img id="image-preview" src="" alt="Preview">
        
        <input type="text" id="userInput" placeholder="Ask anything about Quran, Hadith, Fiqh..." onkeypress="handleKeyPress(event)">
        
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        let base64Image = null;

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Image = e.target.result;
                    const preview = document.getElementById('image-preview');
                    preview.src = base64Image;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            const container = document.getElementById('chat-container');

            if (!messageText && !base64Image) return;

            // Display User Message
            let userHtml = `<div class="message user-message">`;
            if (base64Image) {
                userHtml += `<img src="${base64Image}" style="max-width:150px; border-radius:8px; display:block; margin-bottom:5px;">`;
            }
            if (messageText) {
                userHtml += `<span>${messageText}</span>`;
            }
            userHtml += `</div>`;
            container.innerHTML += userHtml;

            const payloadMessage = messageText;
            const payloadImage = base64Image;

            // Clear inputs
            inputField.value = '';
            document.getElementById('image-preview').style.display = 'none';
            base64Image = null;
            container.scrollTop = container.scrollHeight;

            // Loading state
            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `<div id="${loadingId}" class="message bot-message">Thinking with authentic sources...</div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: payloadMessage, image: payloadImage })
                });
                const data = await response.json();
                
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="message bot-message">${data.response.replace(/\n/g, '<br>')}</div>`;
                container.scrollTop = container.scrollHeight;
            } catch (error) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="message bot-message">Error connecting to server.</div>`;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
