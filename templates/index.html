<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibyan AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #202124;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #ddd;
            background: #ffffff;
        }
        #chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 75%;
            line-height: 1.4;
        }
        .bot { background: #f1f3f4; align-self: flex-start; }
        .user { background: #1a73e8; color: white; align-self: flex-end; }
        .input-box {
            padding: 15px;
            border-top: 1px solid #ddd;
            display: flex;
            background: #ffffff;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 16px;
        }
        button {
            margin-left: 10px;
            padding: 10px 20px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>✨ Tibyan AI</header>
    <div id="chat">
        <div class="msg bot">Hello! Main Tibyan AI hoon. Kaise madad karu?</div>
    </div>
    <div class="input-box">
        <input type="text" id="txt" placeholder="Type a message...">
        <button onclick="send()">Send</button>
    </div>
<script>
function send() {
    let t = document.getElementById('txt');
    if(!t.value) return;
    let c = document.getElementById('chat');
    c.innerHTML += `<div class="msg user">${t.value}</div>`;
    let msg = t.value;
    t.value = '';
    
    fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: msg})
    }).then(res => res.json()).then(d => {
        c.innerHTML += `<div class="msg bot">${d.response}</div>`;
        c.scrollTop = c.scrollHeight;
    });
}
</script>
</body>
</html>
