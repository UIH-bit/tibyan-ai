<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Tibyan AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-6 text-emerald-400">Reset Password</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="mb-4 p-3 bg-red-950/50 border border-red-800 text-red-300 text-sm rounded-lg">
              {% for message in messages %}
                <p>{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div>
                <label class="block text-sm text-slate-400 mb-1">Enter 6-Digit OTP</label>
                <input type="text" name="otp" required maxlength="6" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 focus:outline-none focus:border-emerald-500 text-center tracking-widest text-lg">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">New Password</label>
                <input type="password" name="new_password" required minlength="8" maxlength="200" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-semibold py-2.5 rounded-lg transition duration-200">Update Password</button>
        </form>
    </div>
</body>
</html>
