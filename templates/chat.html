<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibyan AI</title>
    <!-- Stable CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col">

    <header class="p-4 bg-white shadow-sm flex justify-between items-center">
        <div class="font-bold text-emerald-900">Tibyan</div>
    </header>

    <div id="chat-container" class="flex-1 p-4 overflow-y-auto">
        <div class="max-w-md mx-auto text-center mt-10">
            <h1 class="text-2xl font-bold text-emerald-950">Assalamu Alaikum!</h1>
            <p class="text-gray-600">How can I assist you today?</p>
        </div>
    </div>

    <div class="p-4 bg-white border-t">
        <div class="max-w-md mx-auto flex gap-2">
            <input type="text" id="user-prompt" class="w-full p-2 border rounded-lg" placeholder="Ask anything...">
            <button onclick="sendMessage()" class="bg-emerald-900 text-white px-4 py-2 rounded-lg">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-prompt');
            const msg = input.value;
            if(!msg) return;
            
            // Simple logic check
            alert("Sending: " + msg);
            input.value = '';
        }
    </script>
</body>
</html>
