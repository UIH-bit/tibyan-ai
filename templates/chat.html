<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibyan AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Fallback safety styles agar CDN load na ho */
        body { background-color: #fcfbf9; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: white; border-bottom: 1px solid #f3f4f6; }
        .chat-main { flex: 1; overflow-y: auto; padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; box-sizing: border-box; padding-bottom: 90px; }
        .welcome-box { display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 20px; }
        .preset-btn { width: 100%; padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 14px; text-align: left; margin-bottom: 10px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .preset-btn:hover { border-color: #064e3b; }
        .chat-footer { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); padding: 12px; border-top: 1px solid #e5e7eb; backdrop-filter: blur(5px); }
        .chat-form { max-width: 600px; margin: 0 auto; display: flex; gap: 8px; }
        .chat-input { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 12px; outline: none; font-size: 14px; background: #f9fafb; }
        .chat-submit { background: #022c22; color: white; border: none; padding: 0 20px; border-radius: 12px; font-weight: 500; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <button onclick="alert('Menu clicked!')" style="background:none; border:none; font-size:20px; cursor:pointer;">☰</button>
        <div style="display:flex; align-items:center; gap:8px; font-weight:bold; color:#064e3b; font-size:18px;">
            <span style="background:#ecfdf5; padding:2px 10px; border-radius:99px; border:1px solid #d1fae5;">تيان</span> Tibyan
        </div>
        <a href="/" style="text-decoration:none; font-size:18px;">✏️</a>
    </header>

    <!-- Chat Area -->
    <main id="chat-container" class="chat-main">
        <div id="welcome-screen" class="welcome-box">
            <div style="background:#ecfdf5; padding:16px; border-radius:20px; border:1px solid #d1fae5; margin-bottom:12px;">
                <span style="font-size:36px; font-weight:bold; color:#064e3b;">تيان</span>
            </div>
            <h1 style="font-size:22px; font-weight:bold; color:#022c22; margin:0 0 4px 0;">Assalamu Alaikum, {{ current_user.name.title() if current_user and current_user.is_authenticated else 'Jameel' }}!</h1>
            <p style="color:#4b5563; font-size:13px; margin:0 0 20px 0;">How can I assist you in matters of Fiqh-e-Hanafi today?</p>
            
            <!-- Suggested Questions -->
            <div style="width:100%;">
                <button onclick="sendPreset('Tell me about the virtues and method of Jumu\'ah prayer.')" class="preset-btn">
                    <div style="font-weight:600; color:#064e3b; font-size:14px;">Jumu'ah</div>
                    <div style="font-size:12px; color:#4b5563; margin-top:2px;">Tell me about the virtues and method of Jumu'ah prayer.</div>
                </button>
                <button onclick="sendPreset('What are the essential conditions (Sharaait) for Namaz?')" class="preset-btn">
                    <div style="font-weight:600; color:#064e3b; font-size:14px;">Salah</div>
                    <div style="font-size:12px; color:#4b5563; margin-top:2px;">What are the essential conditions (Sharaait) for Namaz?</div>
                </button>
            </div>
        </div>
    </main>

    <!-- Chat Bar -->
    <footer class="chat-footer">
        <form onsubmit="event.preventDefault(); sendMessage();" class="chat-form">
            <input type="text" id="user-prompt" class="chat-input" placeholder="Ask Tibyan...">
            <button type="submit" class="chat-submit">Send</button>
        </form>
    </footer>

    <script>
        const csrfToken = "{{ csrf_token() if csrf_token else '' }}";
        
        async function sendMessage(text = null) {
            const input = document.getElementById('user-prompt');
            const message = text || input.value.trim();
            if (!message) return;

            const welcome = document.getElementById('welcome-screen');
            if (welcome) welcome.style.display = 'none';
            input.value = '';
            
            appendMessage('user', message);

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (csrfToken) headers['X-CSRFToken'] = csrfToken;

                const res = await fetch('/generate', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ prompt: message })
                });
                const data = await res.json();
                appendMessage('ai', data.response || data.answer || "Jawab dastiyab nahi ho saka.");
            } catch (err) {
                appendMessage('ai', "Ma'zirat, connection mein kharabi hai.");
            }
        }

        function sendPreset(topic) { sendMessage(topic); }

        function appendMessage(sender, text) {
            const chat = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.style.margin = '12px 0';
            div.style.textAlign = sender === 'user' ? 'right' : 'left';
            
            const bubble = document.createElement('div');
            bubble.style.display = 'inline-block';
            bubble.style.padding = '12px 16px';
            bubble.style.borderRadius = '16px';
            bubble.style.maxWidth = '85%';
            bubble.style.fontSize = '14px';
            bubble.style.textAlign = 'left';
            bubble.style.boxShadow = '0 1px 2px rgba(0,0,0,0.05)';
            
            if (sender === 'user') {
                bubble.style.background = '#022c22';
                bubble.style.color = 'white';
                bubble.innerText = text;
            } else {
                bubble.style.background = 'white';
                bubble.style.border = '1px solid #e5e7eb';
                bubble.style.color = '#111827';
                bubble.innerHTML = marked.parse(text);
            }
            
            div.appendChild(bubble);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
