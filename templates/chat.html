<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibyan AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #fcfbf9; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { display: flex; justify-content: space-between; padding: 15px; background: white; border-bottom: 1px solid #ddd; }
        .menu-btn { font-size: 24px; cursor: pointer; border: none; background: none; }
        .mirror-pencil { transform: scaleX(-1); display: inline-block; font-size: 20px; }
        /* Sidebar */
        #menu-drawer { position: fixed; left: -280px; top: 0; width: 250px; height: 100%; background: white; z-index: 1000; transition: 0.3s; box-shadow: 2px 0 5px rgba(0,0,0,0.2); padding: 20px; }
        #menu-drawer.open { left: 0; }
        .menu-item { display: block; padding: 15px; text-decoration: none; color: #333; font-weight: bold; border-bottom: 1px solid #eee; }
        /* Chat */
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin: 10px 0; padding: 10px; border-radius: 10px; }
        .user-msg { background: #022c22; color: white; align-self: flex-end; }
        .ai-msg { background: #eee; }
        /* Input */
        footer { padding: 15px; background: white; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
        button#send-btn { background: #022c22; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div id="menu-drawer">
    <button onclick="toggleMenu()" style="float:right; border:none; background:none; font-size:20px;">✕</button>
    <h3 style="margin-top:40px;">Menu</h3>
    <a class="menu-item" href="/profile">👤 Profile</a>
    <a class="menu-item" href="/library">📚 Library</a>
    <a class="menu-item" href="/saved">📜 Saved</a>
    <a class="menu-item" href="/about">❕️ About Us</a>
    {% if current_user.is_authenticated and current_user.is_admin %}
    <a class="menu-item" href="/admin" style="color:red;">⚙️ Admin Login</a>
    {% endif %}
</div>

<header>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div style="font-weight:bold; font-size:18px;">Tibyan</div>
    <span class="mirror-pencil">✏️</span>
</header>

<div id="chat-window">
    <div id="welcome">
        <h2>Assalamu Alaikum, Jameel!</h2>
        <button class="menu-item" onclick="sendMessage('Tell me about Jumu\'ah prayer')">Jumu'ah Prayers</button>
        <button class="menu-item" onclick="sendMessage('Rules of Qirat in Namaz')">Rules of Qirat</button>
    </div>
    <div id="chat-logs"></div>
</div>

<footer>
    <input type="text" id="msg-input" placeholder="Ask Tibyan...">
    <button id="send-btn" onclick="sendMessage()">Send</button>
</footer>

<script>
    function toggleMenu() { document.getElementById('menu-drawer').classList.toggle('open'); }
    
    async function sendMessage(presetText) {
        let input = document.getElementById('msg-input');
        let text = presetText || input.value;
        if (!text) return;
        
        document.getElementById('welcome').style.display = 'none';
        document.getElementById('chat-logs').innerHTML += '<div class="msg user-msg">' + text + '</div>';
        input.value = '';

        const response = await fetch('/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ prompt: text })
        });
        const data = await response.json();
        document.getElementById('chat-logs').innerHTML += '<div class="msg ai-msg">' + marked.parse(data.response || "No response") + '</div>';
    }
</script>
</body>
</html>
