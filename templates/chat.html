<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibyan AI - Islamic Ilmi Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="flex h-screen flex-col bg-[#fcfbf9] font-sans text-slate-900">

    <!-- Header -->
    <header class="flex items-center justify-between p-4 border-b border-slate-100">
        <button onclick="toggleSidebar()" class="p-2 hover:bg-slate-100 rounded-lg">☰</button>
        <div class="flex items-center gap-2">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Tibyan Logo" class="w-8 h-8 object-contain">
            <span class="font-bold text-xl text-emerald-950">Tibyan</span>
        </div>
        <a href="{{ url_for('home') }}" class="p-2 hover:bg-slate-100 rounded-lg">✏️</a>
    </header>

    <!-- Chat Area -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-3xl mx-auto w-full">
        <div id="welcome-screen" class="flex flex-col items-center justify-center h-full text-center">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Tibyan" class="w-24 h-24 mb-6">
            <h1 class="text-3xl font-extrabold text-emerald-950">Assalamu Alaikum, {{ current_user.name.title() }}!</h1>
            <p class="text-slate-600 mt-2 mb-10">How can I assist you in Fiqh-e-Hanafi today?</p>
        </div>
    </main>

    <!-- Chat Bar (Lifted Up) -->
    <footer class="p-4 bg-transparent border-t border-slate-100">
        <form onsubmit="event.preventDefault(); sendMessage();" class="max-w-3xl mx-auto flex items-center gap-2 bg-white border border-slate-200 rounded-2xl p-2 shadow-sm focus-within:ring-2 focus-within:ring-emerald-500">
            <input type="text" id="user-prompt" required class="flex-1 bg-transparent px-3 py-2 outline-none" placeholder="Ask Tibyan...">
            <button type="submit" id="send-btn" class="bg-emerald-950 text-white px-5 py-2.5 rounded-xl font-medium">Send</button>
        </form>
    </footer>

    <script>
        const csrfToken = "{{ csrf_token() }}";
        const promptInput = document.getElementById('user-prompt');
        const chatContainer = document.getElementById('chat-container');
        const welcomeScreen = document.getElementById('welcome-screen');

        async function sendMessage() {
            const text = promptInput.value.trim();
            if (!text) return;
            
            welcomeScreen.style.display = 'none';
            appendMessage('user', text);
            promptInput.value = '';

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await response.json();
                appendMessage('ai', data.response || "Error...");
            } catch (e) {
                appendMessage('system', "Connection error.");
            }
        }

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.className = sender === 'user' ? 'text-right' : 'text-left';
            div.innerHTML = `<div class="inline-block p-4 my-2 rounded-2xl ${sender === 'user' ? 'bg-emerald-950 text-white' : 'bg-white border border-slate-200'}">
                ${sender === 'ai' ? marked.parse(text) : text}
            </div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
