<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibyan AI</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #fcfbf9; }
        #header { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: white; border-bottom: 1px solid #ddd; }
        .menu-btn { cursor: pointer; font-size: 24px; border: none; background: none; }
        .mirror-pencil { transform: scaleX(-1); display: inline-block; }
        /* Drawer */
        #drawer { position: fixed; top: 0; left: -250px; width: 250px; height: 100%; background: white; z-index: 1000; transition: 0.3s; box-shadow: 2px 0 5px rgba(0,0,0,0.2); }
        .drawer-item { display: block; padding: 15px; border-bottom: 1px solid #eee; text-decoration: none; color: #333; }
        /* Chat */
        #container { padding: 20px; }
        .preset-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: white; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; text-align: left; }
        #input-area { position: fixed; bottom: 0; width: 100%; padding: 10px; background: white; border-top: 1px solid #ddd; display: flex; gap: 5px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>

<div id="drawer">
    <div style="padding:15px; font-weight:bold; border-bottom:1px solid #eee;">Menu <span onclick="closeDrawer()" style="float:right; cursor:pointer;">✕</span></div>
    <a class="drawer-item" href="/profile">👤 Profile</a>
    <a class="drawer-item" href="/library">📚 Library</a>
    <a class="drawer-item" href="/saved">📜 Saved</a>
    <a class="drawer-item" href="/about">❕️ About Us</a>
    {% if current_user.is_authenticated and current_user.is_admin %}
    <a class="drawer-item" href="/admin" style="color:red;">⚙️ Admin Login</a>
    {% endif %}
</div>

<div id="header">
    <button class="menu-btn" onclick="openDrawer()">☰</button>
    <div style="font-weight:bold;">Tibyan</div>
    <span class="mirror-pencil">✏️</span>
</div>

<div id="container">
    <h2>Assalamu Alaikum, Jameel!</h2>
    <button class="preset-btn" onclick="sendMsg('Tell me about Jumu\'ah prayer')">Jumu'ah Prayers</button>
    <button class="preset-btn" onclick="sendMsg('Rules of Qirat in Namaz')">Rules of Qirat</button>
    <div id="chat-output"></div>
</div>

<div id="input-area">
    <input type="text" id="user-input" placeholder="Ask Tibyan...">
    <button onclick="sendMsg()">Send</button>
</div>

<script>
    function openDrawer() { document.getElementById('drawer').style.left = '0px'; }
    function closeDrawer() { document.getElementById('drawer').style.left = '-250px'; }
    
    async function sendMsg(text) {
        let input = document.getElementById('user-input');
        let val = text || input.value;
        if (!val) return;
        
        document.getElementById('chat-output').innerHTML += '<p><b>You:</b> ' + val + '</p>';
        input.value = '';
        
        let res = await fetch('/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ prompt: val })
        });
        let data = await res.json();
        document.getElementById('chat-output').innerHTML += '<p><b>Tibyan:</b> ' + (data.response || data.answer) + '</p>';
    }
</script>
</body>
</html>
