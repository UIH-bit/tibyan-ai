<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibyan AI - Islamic Ilmi Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background-color: #fcfbf9; color: #1e293b; }
        .sidebar-open { transform: translateX(0) !important; }
    </style>
</head>
<body class="flex h-screen overflow-hidden relative">

    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/40 z-40 hidden md:hidden"></div>

    <!-- Sidebar / Menu -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-80 bg-white border-r border-slate-200 flex flex-col justify-between p-5 transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out shadow-xl md:shadow-none">
        <div>
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Menu</h2>
                <button type="button" onclick="toggleSidebar()" class="md:hidden text-slate-500 hover:text-slate-800 text-2xl font-bold cursor-pointer">&times;</button>
            </div>

            <!-- Navigation Links -->
            <div class="space-y-1 text-slate-700 font-medium text-sm">
                {% if current_user.is_admin %}
                <a href="{{ url_for('admin_dashboard') }}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-emerald-50 text-emerald-900 font-semibold mb-2">
                    <span>🛠️</span> Admin Panel
                </a>
                {% endif %}
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 transition"><span>👤</span> Profile</a>
                <a href="{{ url_for('home') }}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 transition"><span>📚</span> Library</a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 transition"><span>📜</span> Saved</a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 transition"><span>❕</span> About us</a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 transition"><span>💬</span> Recent chats</a>
                <a href="{{ url_for('logout') }}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-red-600 hover:bg-red-50 transition"><span>🚪</span> Logout</a>
            </div>
        </div>

        <div class="border-t border-slate-200 pt-4 mt-4">
            <p class="text-xs text-center text-slate-400">Tibyan AI - Fiqh-e-Hanafi</p>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col h-full w-full overflow-hidden bg-[#fcfbf9]">
        
        <!-- Top Navbar -->
        <div class="flex items-center justify-between p-4 bg-transparent border-b border-slate-100">
            <button type="button" onclick="toggleSidebar()" class="text-slate-700 focus:outline-none p-1 z-30 cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <div class="flex items-center gap-2">
                <div class="h-8 flex items-center justify-center">
                    <span class="font-bold text-emerald-900 text-lg tracking-wide">تيان (Tibyan)</span>
                </div>
            </div>
            <a href="{{ url_for('home') }}" class="p-2 text-slate-600 hover:text-emerald-800 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            </a>
        </div>

        <!-- Messages & Welcome Screen Container -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-3xl mx-auto w-full">
            <div id="welcome-screen" class="flex flex-col items-center justify-center h-full text-center px-4">
                <div class="w-20 h-20 flex items-center justify-center mb-3">
                    <span class="text-5xl font-extrabold text-emerald-950 font-serif">تيان</span>
                </div>
                <h2 class="text-2xl md:text-3xl font-bold text-emerald-950 mb-1">Assalamu Alaikum, {{ current_user.name.upper() }}!</h2>
                <p class="text-sm md:text-base text-slate-600 mb-6">How can I assist you today?</p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full max-w-xl">
                    <button type="button" onclick="sendSuggestion('Jumu\'ah ki namaz ki fazilat aur tareeqa')" class="p-3 bg-white border border-slate-200 hover:border-emerald-700 rounded-xl text-left text-xs md:text-sm font-medium text-slate-700 shadow-sm transition cursor-pointer">
                        Jumu'ah ki namaz ki fazilat aur tareeqa
                    </button>
                    <button type="button" onclick="sendSuggestion('Namaz ke sharaait kya hain?')" class="p-3 bg-white border border-slate-200 hover:border-emerald-700 rounded-xl text-left text-xs md:text-sm font-medium text-slate-700 shadow-sm transition cursor-pointer">
                        Namaz ke sharaait kya hain?
                    </button>
                </div>
            </div>
        </div>

        <!-- Input Box Area -->
        <div class="p-4 bg-transparent max-w-3xl mx-auto w-full">
            <div class="relative bg-white border border-slate-200 rounded-2xl shadow-sm p-2 flex items-center gap-2">
                <button type="button" class="p-2 text-slate-400 hover:text-slate-600 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                </button>
                <input type="text" id="user-prompt" placeholder="Ask Tibyan..." class="flex-1 bg-transparent border-none px-2 py-2 text-sm md:text-base focus:outline-none text-slate-800 placeholder-slate-400" onkeydown="if(event.key === 'Enter') { event.preventDefault(); sendMessage(); }">
                <button type="button" onclick="sendMessage()" class="bg-emerald-900 hover:bg-emerald-800 text-white p-2.5 rounded-xl transition flex items-center justify-center cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const csrfToken = "{{ csrf_token() }}";

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            sidebar.classList.toggle('sidebar-open');
            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
        }

        function sendSuggestion(text) {
            const promptInput = document.getElementById('user-prompt');
            promptInput.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const promptInput = document.getElementById('user-prompt');
            const promptText = promptInput.value.trim();
            if(!promptText) return;

            const chatContainer = document.getElementById('chat-container');
            const welcomeScreen = document.getElementById('welcome-screen');
            if(welcomeScreen) welcomeScreen.remove();

            // Append User Message
            chatContainer.innerHTML += `
                <div class="flex justify-end my-3">
                    <div class="p-3.5 bg-emerald-900 text-white rounded-2xl max-w-[85%] md:max-w-xl text-sm shadow-sm">
                        <p>${promptText}</p>
                    </div>
                </div>`;
            promptInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({ prompt: promptText })
                });
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                // Append AI Response
                chatContainer.innerHTML += `
                    <div class="flex flex-col items-start my-4 space-y-2 w-full">
                        <div class="p-4 bg-white border border-slate-200 rounded-2xl w-full text-slate-800 text-sm md:text-base shadow-sm space-y-2">
                            <div class="font-semibold text-emerald-900 text-xs tracking-wider uppercase">Tibyan AI (Fiqh-e-Hanafi Scholar)</div>
                            <div class="leading-relaxed space-y-2">${marked.parse(data.response || data.answer || "Jawab dastiyab nahi ho saka.")}</div>
                        </div>
                        <div class="flex items-center gap-4 text-xs text-slate-500 px-2 font-medium">
                            <button onclick="alert('Liked!')" class="hover:text-emerald-800 flex items-center gap-1 transition cursor-pointer">👍 Like</button>
                            <button onclick="alert('Disliked!')" class="hover:text-red-600 flex items-center gap-1 transition cursor-pointer">👎 Dislike</button>
                            <button onclick="alert('Saved to library!')" class="hover:text-emerald-800 flex items-center gap-1 transition cursor-pointer">📜 Save</button>
                            <button onclick="navigator.clipboard.writeText(this.closest('.flex-col').querySelector('.leading-relaxed').innerText); alert('Copied to clipboard!');" class="hover:text-slate-800 flex items-center gap-1 transition cursor-pointer">••• Copy</button>
                        </div>
                    </div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (err) {
                console.error(err);
                alert('Connection error or server issue occurred.');
            }
        }
    </script>
</body>
</html>
